# The dongle is the USB/BLE central for two split peripherals.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Five host BLE profiles plus two split peripherals.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# USB lock indicators can be forwarded to the Glove80 peripherals.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# The exported Glove80 keymap contains global RGB behaviors. The dongle needs
# a one-pixel dummy strip so it can own and relay those behaviors to the halves.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_SPI=y
CONFIG_WS2812_STRIP=y

# Persistent split bonds and host profiles live in the storage partition.
CONFIG_SETTINGS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Makerdiary UF2 Bootloader 0.7.1, no SoftDevice.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0xADA52840"
CONFIG_USE_DT_CODE_PARTITION=y

# The dongle is USB powered and should remain available as the central.
CONFIG_ZMK_SLEEP=n

# Use the maximum supported nRF52840 transmit power for a robust split link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
