# Clear all persisted bonds/settings, then remain inert until normal firmware is flashed.
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_RESET_ON_START=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n

# Keep USB enabled so the reset image is a valid ZMK build for this bare board.
CONFIG_ZMK_USB=y

# Persistent storage support.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Makerdiary UF2 Bootloader 0.7.1, no SoftDevice.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0xADA52840"
CONFIG_USE_DT_CODE_PARTITION=y

