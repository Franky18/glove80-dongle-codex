---
include:
  # Normal firmware: the dongle is the central and both Glove80 halves are peripherals.
  - board: nrf52840_mdk_usb_dongle
    shield: glove80_dongle
    artifact-name: glove80_dongle-central

  - board: glove80_lh
    artifact-name: glove80_lh-peripheral
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
      -DCONFIG_ZMK_BATTERY_REPORTING=y
      -DCONFIG_BT_BAS=y
      -DCONFIG_ZMK_USB=n
      -DCONFIG_ZMK_USB_BOOT=n
      -DCONFIG_ZMK_RGB_UNDERGLOW=y
      -DCONFIG_ZMK_HID_INDICATORS=y
      -DCONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

  - board: glove80_rh
    artifact-name: glove80_rh-peripheral
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
      -DCONFIG_ZMK_BATTERY_REPORTING=y
      -DCONFIG_BT_BAS=y
      -DCONFIG_ZMK_USB=n
      -DCONFIG_ZMK_HID_INDICATORS=y
      -DCONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

  # One settings-reset image per physical device. These must be flashed before
  # switching from the stock left-central topology to the dongle-central topology.
  - board: nrf52840_mdk_usb_dongle
    shield: glove80_dongle_reset
    artifact-name: settings_reset-dongle

  - board: glove80_lh
    shield: settings_reset
    artifact-name: settings_reset-glove80_lh

  - board: glove80_rh
    shield: settings_reset
    artifact-name: settings_reset-glove80_rh
